<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>STOCK STORE — Premium Fashion for Men</title>
    <meta name="description" content="Discover the latest fashion trends at STOCK STORE. Premium men's clothing, shoes and accessories with cash on delivery." />
    <meta name="theme-color" content="#f8f7f4" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="STOCK STORE" />
    <meta property="og:title" content="STOCK STORE — Wear Your Style" />
    <meta property="og:description" content="Premium men's clothing, shoes and accessories." />
    <meta property="og:image" content="https://01128567476.github.io/stock-store/store-hero.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply saved language before paint to avoid a RTL/LTR flash
      try {
        var lang = localStorage.getItem('mv-lang');
        if (lang !== 'ar' && lang !== 'en') lang = 'ar';
        document.documentElement.setAttribute('lang', lang);
        document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
      } catch (e) {
        document.documentElement.setAttribute('lang', 'ar');
        document.documentElement.setAttribute('dir', 'rtl');
      }
    </script>
    <script>
      try {
        localStorage.removeItem('mv-theme');
        var t = localStorage.getItem('mv-theme-v2');
        t = t ? JSON.parse(t) : 'light';
        if (t !== 'light' && t !== 'dark') t = 'light';
        document.documentElement.setAttribute('data-theme', t);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'dark' ? '#11100f' : '#f8f7f4');
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "STOCK STORE",
        "url": "/",
        "description": "Premium fashion brand for men."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
